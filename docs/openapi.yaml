openapi: 3.0.1
info:
  title: Flood Monitor API
  description: "REST-Schnittstelle für ein Hochwasser-Frühwarnsystem. Alle Antworten\
    \ gibt es als JSON (Standard) oder XML, gesteuert über den Accept-Header. Bei\
    \ anderen Formaten kommt 406. Fehler werden immer im gleichen Aufbau zurückgegeben\
    \ (timestamp, status, error, message, path). Bei unerwarteten Fehlern kommt 500."
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- apiKey: []
tags:
- name: Flood Monitor
  description: "Messstationen, Messwerte, Statistik und Warnungen"
paths:
  /api/v1/stations:
    get:
      tags:
      - Flood Monitor
      summary: Alle Messstationen abrufen
      description: "Liefert alle Stationen. Optional kann nach Fluss, Aktiv-Status\
        \ und aktueller Warnstufe gefiltert werden."
      operationId: getStations
      parameters:
      - name: river
        in: query
        description: "Name des Flusses, z. B. Donau"
        required: false
        schema:
          type: string
      - name: isActive
        in: query
        description: "true = nur aktive Stationen, false = nur inaktive Stationen"
        required: false
        schema:
          type: boolean
      - name: warningLevel
        in: query
        description: aktuelle Warnstufe der Station
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      responses:
        "200":
          description: Liste der Stationen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: "Ungültiger Parameter, z. B. unbekannte Warnstufe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stations/{stationId}:
    get:
      tags:
      - Flood Monitor
      summary: Einzelne Station abrufen
      operationId: getStation
      parameters:
      - name: stationId
        in: path
        description: ID der Station
        required: true
        schema:
          type: string
        example: ST-001
      responses:
        "200":
          description: Die Station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
            application/xml:
              schema:
                $ref: '#/components/schemas/Station'
        "404":
          description: Station nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stations/{stationId}/statistics:
    get:
      tags:
      - Flood Monitor
      summary: Statistik einer Station abrufen
      description: "Niedrigster, höchster und durchschnittlicher Wasserstand, durchschnittliche\
        \ Durchflussmenge, Summe des Niederschlags, Anzahl der Messungen, Warnungen\
        \ und kritischen Warnungen."
      operationId: getStatistics
      parameters:
      - name: stationId
        in: path
        description: ID der Station
        required: true
        schema:
          type: string
        example: ST-001
      - name: from
        in: query
        description: Beginn des Zeitraums im ISO-8601-Format
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Ende des Zeitraums im ISO-8601-Format
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "400":
          description: Ungültiger Zeitraum oder falsches Datumsformat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Station nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Die Statistik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
            application/xml:
              schema:
                $ref: '#/components/schemas/Statistics'
  /api/v1/stations/{stationId}/measurements:
    get:
      tags:
      - Flood Monitor
      summary: Historische Messwerte abrufen
      description: "Liefert die Messwerte einer Station, neueste zuerst. Optional\
        \ nach Zeitraum und Warnstufe filterbar."
      operationId: getMeasurements
      parameters:
      - name: stationId
        in: path
        description: ID der Station
        required: true
        schema:
          type: string
        example: ST-001
      - name: from
        in: query
        description: "Beginn des Zeitraums im ISO-8601-Format, z. B. 2026-05-01T08:00:00Z"
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: "Ende des Zeitraums im ISO-8601-Format, z. B. 2026-05-01T12:00:00Z"
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: maximale Anzahl der Messwerte (1 bis 1000)
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: warningLevel
        in: query
        description: nur Messwerte mit dieser Warnstufe
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      responses:
        "400":
          description: "Ungültiger Parameter: from nach to, falsches Datumsformat,\
            \ unbekannte Warnstufe oder limit nicht zwischen 1 und 1000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Liste der Messwerte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
        "404":
          description: Station nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stations/{stationId}/measurements/latest:
    get:
      tags:
      - Flood Monitor
      summary: Aktuellsten Messwert abrufen
      description: "Liefert die neueste Messung der Station. Gibt es noch keine Messung,\
        \ kommt 204."
      operationId: getLatestMeasurement
      parameters:
      - name: stationId
        in: path
        description: ID der Station
        required: true
        schema:
          type: string
        example: ST-001
      responses:
        "200":
          description: Die neueste Messung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
            application/xml:
              schema:
                $ref: '#/components/schemas/Measurement'
        "404":
          description: Station nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "204":
          description: "Station existiert, hat aber noch keine Messung"
  /api/v1/alerts:
    get:
      tags:
      - Flood Monitor
      summary: Aktuelle Warnungen abrufen
      description: "Liefert die neueste Messung aller Stationen, deren aktuelle Warnstufe\
        \ WARNING oder CRITICAL ist."
      operationId: getAlerts
      parameters:
      - name: warningLevel
        in: query
        description: nur Warnungen mit dieser Warnstufe (WARNING oder CRITICAL)
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      - name: river
        in: query
        description: "Name des Flusses, z. B. Donau"
        required: false
        schema:
          type: string
      responses:
        "406":
          description: Format nicht unterstützt (nur JSON und XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Ungültige Warnstufe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: API-Key fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: API-Key ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Liste der aktuellen Warnungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    Station:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        river:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        normalWaterLevel:
          type: number
          format: double
        warningWaterLevel:
          type: number
          format: double
        criticalWaterLevel:
          type: number
          format: double
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        isActive:
          type: boolean
    Statistics:
      type: object
      properties:
        stationId:
          type: string
        minWaterLevel:
          type: number
          format: double
        maxWaterLevel:
          type: number
          format: double
        averageWaterLevel:
          type: number
          format: double
        averageFlowRate:
          type: number
          format: double
        totalRainfall:
          type: number
          format: double
        measurementCount:
          type: integer
          format: int32
        warningCount:
          type: integer
          format: int32
        criticalCount:
          type: integer
          format: int32
    Measurement:
      type: object
      properties:
        stationId:
          type: string
        timestamp:
          type: string
          format: date-time
        waterLevel:
          type: number
          format: double
        flowRate:
          type: number
          format: double
        rainfall:
          type: number
          format: double
        temperature:
          type: number
          format: double
        batteryLevel:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        warningLevel:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
  securitySchemes:
    apiKey:
      type: apiKey
      description: "API-Key im Header X-API-KEY. Fehlt er, kommt 401, ist er falsch,\
        \ kommt 403."
      name: X-API-KEY
      in: header
